# Testbed: api -> forge-proxy -> postgres
#   just run-testbed     (or: docker compose -f testbed/docker-compose.yml up -d --build)
# PROXY_DELAY_MS sets the proxy's fixed latency per chunk (default 50).
name: forge-testbed

services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 2s
      timeout: 3s
      retries: 30

  proxy:
    build: ../proxy
    command: ["0.0.0.0:6544", "db:5432", "${PROXY_DELAY_MS:-50}"]
    ports:
      - "6544:6544"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    environment:
      # Runtime traffic goes through the proxy; migrations go straight to Postgres.
      DATABASE_URL: postgres://app:app@proxy:6544/forge
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@db:5432/forge
      JWT_SECRET: dev-only-secret
      JWT_EXPIRES_IN_SECONDS: "900"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      proxy:
        condition: service_started

volumes:
  db-data:
